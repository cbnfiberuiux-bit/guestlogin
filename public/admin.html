<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest Admin</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<main>
  <section id="login" hidden>
    <h1>Admin Login</h1>
    <form id="loginForm" style="display:grid;gap:8px;max-width:360px">
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password" required>
      <button>Masuk</button>
    </form>
  </section>

  <section id="app" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px">
      <h1 style="margin:0">Guests <span id="count" class="muted"></span></h1>
      <div><a href="./" target="_blank"><button class="ghost">Buka layar</button></a> <button class="ghost" id="logout">Keluar</button></div>
    </div>
    <form id="guestForm" class="row">
      <input name="name" placeholder="Nama" required>
      <input name="company" placeholder="Perusahaan">
      <select name="tier"><option>REGULAR</option><option>VIP</option></select>
      <input name="table_no" placeholder="Table">
      <button id="save">Tambah</button>
    </form>
    <input id="search" placeholder="Cari nama / perusahaan / table" style="margin-bottom:8px">
    <div class="wrap"><table><tbody id="list"></tbody></table></div>
  </section>
  <p class="err" id="err"></p>
</main>

<dialog id="qr">
  <img id="qrImg" alt="QR code">
  <p id="qrName"></p>
  <a id="qrDl"><button>Download</button></a> <button class="ghost" onclick="qr.close()">Tutup</button>
</dialog>

<script type="module">
import { db } from './db.js';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const form = $('guestForm');
let guests = [], editing = null;
const fail = e => { $('err').textContent = e?.message ?? ''; return e; };

async function load() {
  const { data, error } = await db.from('guests').select('*').order('created_at', { ascending: false });
  if (fail(error)) return;
  guests = data; render();
}

function render() {
  const q = $('search').value.toLowerCase();
  const rows = guests.filter(g => [g.name, g.company, g.table_no].join(' ').toLowerCase().includes(q));
  $('count').textContent = `(${guests.length} · VIP ${guests.filter(g => g.tier === 'VIP').length})`;
  $('list').innerHTML = rows.map(g => `<tr>
    <td><b>${esc(g.name)}</b><div class="muted">${esc(g.company)}</div></td>
    <td><span class="badge ${g.tier}">${g.tier}</span></td>
    <td>${g.table_no ? 'Table ' + esc(g.table_no) : '<span class="muted">–</span>'}</td>
    <td><button class="ghost" data-qr="${g.id}">QR</button><button class="ghost" data-edit="${g.id}">Edit</button><button class="danger" data-del="${g.id}">Hapus</button></td>
  </tr>`).join('') || '<tr><td class="muted">Belum ada tamu</td></tr>';
}

function showQr(g) {
  const url = `${location.origin}/?c=${g.code}`;
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  $('qrImg').src = $('qrDl').href = qr.createDataURL(10, 2);
  $('qrDl').download = `${g.tier}-${g.name}.gif`.replace(/[^\w.-]+/g, '_');
  $('qrName').innerHTML = `<b>${esc(g.name)}</b> · ${g.tier}${g.table_no ? ' · Table ' + esc(g.table_no) : ''}<br><small class="muted">${url}</small>`;
  $('qr').showModal();
}

form.onsubmit = async e => {
  e.preventDefault();
  const row = Object.fromEntries(new FormData(form));
  const { error } = editing
    ? await db.from('guests').update(row).eq('id', editing)
    : await db.from('guests').insert(row);
  if (fail(error)) return;
  editing = null; $('save').textContent = 'Tambah'; form.reset(); form.elements.name.focus(); load();
};

$('list').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const g = guests.find(x => x.id === (b.dataset.qr || b.dataset.edit || b.dataset.del));
  if (b.dataset.qr) showQr(g);
  if (b.dataset.edit) {
    editing = g.id; $('save').textContent = 'Simpan';
    for (const k of ['name', 'company', 'tier', 'table_no']) form.elements[k].value = g[k] ?? '';
    form.elements.name.focus();
  }
  if (b.dataset.del && confirm(`Hapus ${g.name}? QR-nya jadi tidak berlaku.`)) {
    if (!fail((await db.from('guests').delete().eq('id', g.id)).error)) load();
  }
};

$('search').oninput = render;
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const { error } = await db.auth.signInWithPassword(Object.fromEntries(new FormData(e.target)));
  fail(error);
};
$('logout').onclick = () => db.auth.signOut();

db.auth.onAuthStateChange((_, session) => {
  $('login').hidden = !!session; $('app').hidden = !session;
  if (session) load();
});
</script>
</body>
</html>
